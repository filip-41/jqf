[package]
name = "jqf-data-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true
description = "Repository-owned jqf data performance harness"
build = "build.rs"

[features]
allocation-stats = ["jqf-bench-core/allocation-stats"]

[dependencies]
jqf-bench-core = { workspace = true }
jqf-codec-core = { workspace = true }
jqf-codec-json = { workspace = true }
jqf-data = { workspace = true, features = ["benchmark-internals"] }
jqf-resource = { workspace = true }
jqf-source = { workspace = true }
serde_json = "=1.0.150"

[[bin]]
name = "jqf-data-bench"
path = "src/main.rs"

[lints]
workspace = true
