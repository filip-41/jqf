[package]
name = "jqf-codec-json-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autobins = false
rust-version.workspace = true
build = "build.rs"

[features]
allocation-stats = ["jqf-bench-core/allocation-stats"]

[dependencies]
jqf-bench-core = { workspace = true }
jqf-codec-core = { workspace = true }
jqf-codec-json = { workspace = true }
jqf-data = { workspace = true }
jqf-data-bench = { workspace = true }
jqf-resource = { workspace = true }
jqf-source = { workspace = true }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
simd-json = { version = "=0.17.0", default-features = false, features = ["runtime-detection", "serde_impl", "swar-number-parsing"] }
sonic-rs = "=0.5.8"

[[bin]]
name = "jqf-codec-json-bench"
path = "src/main.rs"

[lints]
workspace = true
