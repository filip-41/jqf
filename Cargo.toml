[workspace]
resolver = "3"
members = [
    "jqf-source",
    "jqf-resource",
    "jqf-data",
    "jqf-syntax",
    "jqf-builtins",
    "jqf-codec/core",
    "jqf-codec/json",
    "jqf-codec/toml",
    "jqf-codec/messagepack",
    "jqf-codec/cbor",
    "jqf-codec/delimited",
    "jqf-codec/render",
    "jqf-codec/xml",
    "jqf-codec/html",
    "jqf-codec/ini",
    "jqf-codec/yaml",
    "jqf-codec/jqft",
    "jqf-engine",
    "jqf-runtime",
    "jqf-sdk",
    "jqf-sdk-ffi",
    "jqf-cli",
    "bindings/wasm",
    "tools/jqf-bench-core",
    "tools/jqf-source-bench",
    "tools/jqf-resource-bench",
    "tools/jqf-data-bench",
    "tools/jqf-codec-core-bench",
    "tools/jqf-codec-json-bench",
    "tools/jqf-codec-toml-bench",
    "tools/jqf-codec-csv-bench",
    "tools/jqf-codec-receipts",
    "tools/jqf-xpath-conformance",
    "tools/jqf-sdk-smoke",
    "tools/jqf-syntax-compat",
    "tools/jqf-syntax-bench",
    "tools/jqf-engine-bench",
]

# The workspace lint floor.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Shared packaging metadata
[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/filip-41/jqf"
rust-version = "1.96"

[workspace.dependencies]
jqf-source = { path = "jqf-source", version = "0.1.0-alpha.1" }
jqf-resource = { path = "jqf-resource", version = "0.1.0-alpha.1" }
jqf-data = { path = "jqf-data", version = "0.1.0-alpha.1" }
jqf-syntax = { path = "jqf-syntax", version = "0.1.0-alpha.1" }
jqf-builtins = { path = "jqf-builtins", version = "0.1.0-alpha.1" }
jqf-codec-core = { path = "jqf-codec/core", version = "0.1.0-alpha.1" }
jqf-codec-json = { path = "jqf-codec/json", version = "0.1.0-alpha.1" }
jqf-codec-toml = { path = "jqf-codec/toml", version = "0.1.0-alpha.1" }
jqf-codec-messagepack = { path = "jqf-codec/messagepack", version = "0.1.0-alpha.1" }
jqf-codec-cbor = { path = "jqf-codec/cbor", version = "0.1.0-alpha.1" }
jqf-codec-delimited = { path = "jqf-codec/delimited", version = "0.1.0-alpha.1" }
jqf-codec-render = { path = "jqf-codec/render", version = "0.1.0-alpha.1" }
jqf-codec-xml = { path = "jqf-codec/xml", version = "0.1.0-alpha.1" }
jqf-codec-html = { path = "jqf-codec/html", version = "0.1.0-alpha.1" }
jqf-codec-ini = { path = "jqf-codec/ini", version = "0.1.0-alpha.1" }
jqf-codec-yaml = { path = "jqf-codec/yaml", version = "0.1.0-alpha.1" }
jqf-codec-jqft = { path = "jqf-codec/jqft", version = "0.1.0-alpha.1" }
jqf-engine = { path = "jqf-engine", version = "0.1.0-alpha.1" }
jqf-runtime = { path = "jqf-runtime", version = "0.1.0-alpha.1" }
jqf-sdk = { path = "jqf-sdk", version = "0.1.0-alpha.1" }
jqf-sdk-ffi = { path = "jqf-sdk-ffi", version = "0.1.0-alpha.1" }
jqf-bench-core = { path = "tools/jqf-bench-core", version = "0.1.0-alpha.1" }
jqf-source-bench = { path = "tools/jqf-source-bench", version = "0.1.0-alpha.1" }
jqf-resource-bench = { path = "tools/jqf-resource-bench", version = "0.1.0-alpha.1" }
jqf-data-bench = { path = "tools/jqf-data-bench", version = "0.1.0-alpha.1" }
jqf-codec-core-bench = { path = "tools/jqf-codec-core-bench", version = "0.1.0-alpha.1" }
jqf-codec-json-bench = { path = "tools/jqf-codec-json-bench", version = "0.1.0-alpha.1" }
jqf-codec-toml-bench = { path = "tools/jqf-codec-toml-bench", version = "0.1.0-alpha.1" }
jqf-codec-csv-bench = { path = "tools/jqf-codec-csv-bench", version = "0.1.0-alpha.1" }
jqf-codec-receipts = { path = "tools/jqf-codec-receipts", version = "0.1.0-alpha.1" }
jqf-xpath-conformance = { path = "tools/jqf-xpath-conformance", version = "0.1.0-alpha.1" }
jqf-sdk-smoke = { path = "tools/jqf-sdk-smoke", version = "0.1.0-alpha.1" }
jqf-syntax-compat = { path = "tools/jqf-syntax-compat", version = "0.1.0-alpha.1" }
jqf-syntax-bench = { path = "tools/jqf-syntax-bench", version = "0.1.0-alpha.1" }
jqf-engine-bench = { path = "tools/jqf-engine-bench", version = "0.1.0-alpha.1" }

memchr = { version = "2.8", default-features = false }
uuid = { version = "1.12", default-features = false, features = ["v4", "v7"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
