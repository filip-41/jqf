<script src="assets/vendor/marked.min.js"></script>
<script>
// The rail's Docs entries are the .md files in this directory, fetched and
// rendered as-is — the served markdown IS the page. Whitelist keeps the
// fetches to the files the rail names. Hash grammar: `#<page>` selects a
// page, `#<page>/<anchor>` lands mid-page, a bare `#<anchor>` scrolls inside
// the page already on screen.
const PAGES = {
  'overview':    { file: 'README.md',       title: 'Overview' },
  'architecture':{ file: 'architecture.md', title: 'Architecture' },
  'usage':       { file: 'usage.md',        title: 'Usage' },
  'from-jq':     { file: 'from-jq.md',      title: 'Coming from jq' },
};
const PAGES_BY_FILE = Object.fromEntries(Object.entries(PAGES).map(([k, v]) => [v.file, k]));

async function show() {
  const [name, anchor] = location.hash.slice(1).split('/');
  const out = document.getElementById('page');
  if (name && !PAGES[name] && out.childElementCount) {
    // not a page name: an in-page anchor — scroll within what's on screen
    const el = document.getElementById(name);
    if (el) el.scrollIntoView();
    return;
  }
  const pageName = PAGES[name] ? name : 'overview';
  const page = PAGES[pageName];
  const targetAnchor = PAGES[name] ? anchor : name;
  for (const a of document.querySelectorAll('#nav a')) {
    const active = a.getAttribute('href') === '#' + pageName;
    a.classList.toggle('active', active);
    if (active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
  try {
    const response = await fetch(page.file);
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const md = await response.text();
    out.innerHTML = marked.parse(md);
    // marked core no longer assigns heading ids; add GFM-style slugs so
    // fragment links (usage.md#editing …) land on their sections.
    const slug = (t) => t.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, '').replace(/\s+/g, '-');
    for (const h of out.querySelectorAll('h1,h2,h3,h4,h5,h6')) {
      if (!h.id) h.id = slug(h.textContent);
    }
    for (const pre of out.querySelectorAll('pre')) {
      if (pre.scrollWidth > pre.clientWidth) pre.tabIndex = 0;
    }
    document.title = page.title + ' · jqf';
    // Links between the served .md files become rail navigation (carrying a
    // fragment as `<page>/<anchor>`); anything else keeps its literal target.
    for (const a of out.querySelectorAll('a[href]')) {
      const m = a.getAttribute('href').replace(/^\.\//, '').match(/^([\w.-]+\.md)(?:#([\w-]+))?$/);
      if (m && PAGES_BY_FILE[m[1]]) {
        a.setAttribute('href', '#' + PAGES_BY_FILE[m[1]] + (m[2] ? '/' + m[2] : ''));
      }
    }
    if (targetAnchor) requestAnimationFrame(() => document.getElementById(targetAnchor)?.scrollIntoView());
  } catch (error) {
    out.innerHTML = `<p>failed to load <code>${page.file}</code>: ${error.message} — serve this directory over HTTP.</p>`;
  }
}
window.addEventListener('hashchange', show);
show();
</script>
