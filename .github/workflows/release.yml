name: release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$RELEASE_TAG"
          version="$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "jqf"))')"
          test "$tag" = "v$version"
      - run: tools/pgo/jqf-pgo-build.sh
        env:
          JQF_PGO_TARGET: ${{ matrix.target }}
          CARGO_FLAGS: --locked
      - run: |
          asset="jqf-${{ matrix.target }}"
          version="$RELEASE_TAG"
          version="${version#v}"
          mkdir "$asset"
          cp target/pgo/jqf "$asset/jqf"
          cp docs/jqf.1 "$asset/"
          cp tools/completions/jqf.bash tools/completions/jqf.zsh "$asset/"
          test "$("$asset/jqf" --version)" = "jqf-$version"
          "$asset/jqf" --diagnostics -n 'null' </dev/null 2>&1 | grep -F 'build=pgo'
          python3 - "$asset" "$asset.tar.gz" <<'PY'
          import gzip
          import sys
          import tarfile
          from pathlib import Path

          source = Path(sys.argv[1])
          paths = [source, *sorted(source.rglob("*"))]
          with Path(sys.argv[2]).open("wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w", format=tarfile.GNU_FORMAT) as archive:
                      for path in paths:
                          info = archive.gettarinfo(path, arcname=path.relative_to(source.parent))
                          info.uid = info.gid = info.mtime = 0
                          info.uname = info.gname = ""
                          if path.is_file():
                              with path.open("rb") as contents:
                                  archive.addfile(info, contents)
                          else:
                              archive.addfile(info)
          PY
          shasum -a 256 "$asset.tar.gz" >"$asset.tar.gz.sha256"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: |
          asset="jqf-${{ matrix.target }}.tar.gz"
          tag="$RELEASE_TAG"
          upload_or_verify() {
            file="$1"
            local_digest="sha256:$(shasum -a 256 "$file" | awk '{print $1}')"
            remote_digest="$(gh release view "$tag" --json assets \
              --jq ".assets[] | select(.name == \"$file\") | .digest")"
            if [ -z "$remote_digest" ]; then
              gh release upload "$tag" "$file"
            elif [ "$remote_digest" != "$local_digest" ]; then
              echo "release asset $file already exists with digest $remote_digest, expected $local_digest" >&2
              exit 1
            else
              echo "release asset $file already exists with the expected digest"
            fi
          }
          upload_or_verify "$asset"
          upload_or_verify "$asset.sha256"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
