name: release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p jqf --target "${{ matrix.target }}"
      - run: |
          cp "target/${{ matrix.target }}/release/jqf" "jqf-${{ matrix.target }}"
          "./jqf-${{ matrix.target }}" --version
      - run: gh release upload "${{ github.event.release.tag_name }}" "jqf-${{ matrix.target }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
