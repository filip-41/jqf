# Diagnostic codes: the binding contract's spine.
#
# Every retained row has a stable `id` and `revision`; a changed meaning is a
# NEW code, never a repurposed id. tools/jqf-diag-codes-gen.py generates
# jqf-resource/src/diag/codes.rs, and a freshness check is a gate.
#
# class: Semantic | Machine | ProgramRaised | Informational
#   Semantic/ProgramRaised/Machine are the raise channels (the two-channel law
#   plus the raised-value channel); Informational records have no channel
#   (route, cost, precision).
# severity: Error | Warning | Info | Trace
# reserved: the code is reserved for a documented v2 producer; never emitted.

