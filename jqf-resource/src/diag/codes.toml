# The cross-format encode-projection policy's event codes: one record per
# projected VALUE, mirroring the counter the host totals into one warning line
# per kind. Informational because the bytes are correct and canonical; the
# warning exists because the projection is lossy.
[[code]]
name = "PROJECTION_TEMPORAL"
id = 33
revision = 1
class = "Informational"
severity = "Warning"
description = "A date, time, or date-time was rendered as canonical RFC 3339 text because the target has no native temporal spelling."

[[code]]
name = "PROJECTION_TAG"
id = 34
revision = 1
class = "Informational"
severity = "Warning"
description = "A tagged value was published as its bare payload because the target has no native tag spelling."

[[code]]
name = "PROJECTION_BYTES"
id = 35
revision = 1
class = "Informational"
severity = "Warning"
description = "A byte string was rendered as base64url text (RFC 8949 section 6.5) because the target has no native byte-string spelling."

# The mismatch dial's event surface: two codes for all eleven cells
# — one informational per-run warn report, one semantic strict raise, each
# carrying the CELL NAME in its payload, so a new cell never grows the registry.
[[code]]
name = "MISMATCH_WARN"
id = 38
revision = 1
class = "Informational"
severity = "Warning"
description = "The mismatch dial's capped, aggregated warn report: one record per run, named after the run, carrying the per-cell counts."

[[code]]
name = "MISMATCH_STRICT"
id = 39
revision = 1
class = "Semantic"
severity = "Error"
description = "A mismatch cell raised under the strict dial; the payload names the cell."

[[code]]
name = "RAISE_ENGINE_CARDINALITY"
id = 40
revision = 1
class = "Semantic"
severity = "Error"
description = "A ~generator init/update/extract emitted two or more values on one pull: one state, one emission, per pull."


